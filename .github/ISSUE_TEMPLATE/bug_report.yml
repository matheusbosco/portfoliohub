name: "🐛 Reportar bug"
description: "Relate um problema no site ou no repositório"
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Obrigado por reportar! Preencha os campos abaixo."
  - type: textarea
    id: descricao
    attributes:
      label: "Descrição do bug"
      description: "O que aconteceu?"
      placeholder: "Ao clicar em X, ocorre Y..."
    validations:
      required: true
  - type: textarea
    id: passos
    attributes:
      label: "Passos para reproduzir"
      placeholder: |
        1. Acesse '...'
        2. Clique em '...'
        3. Veja o erro
    validations:
      required: true
  - type: input
    id: navegador
    attributes:
      label: "Navegador / dispositivo"
      placeholder: "Chrome 125, Windows 11"
    validations:
      required: false
